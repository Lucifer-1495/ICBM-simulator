<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Missile Command System</title>
  <style>
    body {
      background: #0f0f0f;
      color: lime;
      font-family: monospace;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    h1 { 
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      margin: 0;
      z-index: 100;
      text-shadow: 0 0 5px black;
    }

    #earth3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #terminalBoot {
      position: absolute;
      top: 60px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: lime;
      padding: 10px;
      height: 100px;
      width: 400px;
      overflow-y: auto;
      border: 1px solid lime;
      z-index: 100;
    }

    #console {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      width: 400px;
      height: 150px;
      overflow-y: auto;
      border: 1px solid lime;
      z-index: 100;
    }

    .control-panel {
      position: absolute;
      top: 180px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border: 1px solid lime;
      z-index: 100;
      width: 400px;
    }

    .phase {
      display: none;
    }

    .active {
      display: block;
    }

    input, select, button {
      margin: 3px;
      padding: 6px;
      background: black;
      color: lime;
      border: 1px solid lime;
      font-family: monospace;
      font-size: 12px;
      width: 95%;
    }

    button {
      background: #900;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #c00;
      transform: scale(1.05);
    }

    #radarContainer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 300px;
      height: 300px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid lime;
      z-index: 100;
      display: none;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
    }

    .explosion-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,100,0,0.8) 0%, rgba(255,200,0,0.6) 50%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.5s;
    }

    select {
      height: 30px;
    }

    .button-row {
      display: flex;
      justify-content: space-between;
    }

    .button-row button {
      width: 48%;
    }
  </style>
</head>
<body>
  <h1>🛡 ADVANCED MISSILE COMMAND SYSTEM</h1>
  <div id="terminalBoot"></div>
  <div id="earth3d"></div>
  <div class="explosion-overlay" id="explosionEffect"></div>

  <div class="control-panel">
    <div class="phase active" id="phase1">
      <button onclick="unlockSystem()">🔓 FACE SCAN</button>
    </div>

    <div class="phase" id="phase2">
      <input id="code" type="password" placeholder="LAUNCH CODE">
      <input id="biometric" type="password" placeholder="BIOMETRIC CODE">
      <button onclick="authenticate()">🔐 AUTHENTICATE</button>
    </div>

    <div class="phase" id="phase3">
      <input id="lat" placeholder="TARGET LATITUDE">
      <input id="lon" placeholder="TARGET LONGITUDE">
      <button onclick="fixTarget()">📍 LOCK TARGET</button>
    </div>

    <div class="phase" id="phase4">
      <select id="siloSelect">
        <option disabled selected>SELECT SILO</option>
        <option>SILO ALPHA - ALASKA</option>
        <option>SILO BRAVO - NEVADA</option>
        <option>SILO CHARLIE - INDIA</option>
        <option>SILO DELTA - RUSSIA</option>
        <option>SILO ECHO - CHINA</option>
      </select>
      <select id="missileSelect">
        <option disabled selected>SELECT MISSILE</option>
        <option>TRIDENT II D5</option>
        <option>MINUTEMAN III</option>
        <option>DF-41</option>
        <option>RS-28 SARMAT</option>
        <option>AGNI-VI</option>
        <option>HWASONG-17</option>
        <option>M51</option>
        <option>JERICHO III</option>
        <option>SHAHEEN-III</option>
        <option>R-29RMU2</option>
      </select>
      <select id="warheadSelect">
        <option disabled selected>SELECT WARHEAD</option>
        <option>W88 (475kT)</option>
        <option>W87 (300kT)</option>
        <option>B83 (1.2MT)</option>
        <option>B61-12 (50kT)</option>
        <option>RS-28 PAYLOAD (50MT)</option>
        <option>TN-75 (150kT)</option>
        <option>TNA (300kT)</option>
        <option>DF-41 MIRV (800kT)</option>
        <option>AGNI-V WARHEAD (500kT)</option>
        <option>HWASONG THERMONUKE (1MT)</option>
      </select>
      <select id="missileCount">
        <option value="1">LAUNCH 1 MISSILE</option>
        <option value="2">LAUNCH 2 MISSILES</option>
        <option value="3">LAUNCH 3 MISSILES</option>
        <option value="4">LAUNCH 4 MISSILES</option>
        <option value="5">LAUNCH 5 MISSILES</option>
      </select>
      <div class="button-row">
        <button onclick="startLaunch()">🚀 INITIATE LAUNCH</button>
        <button onclick="resetAll()">🔄 SYSTEM RESET</button>
      </div>
    </div>
  </div>

  <div id="console"></div>
  <div id="radarContainer">
    <canvas id="radarCanvas"></canvas>
  </div>

  <audio id="sirenAudio" preload="auto">
    <source src="siren.mp3" type="audio/mpeg">
  </audio>
  <audio id="launchAudio" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-rocket-whoosh-1714.mp3" type="audio/mpeg">
  </audio>
  <audio id="explosionAudio" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-explosion-impact-1684.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <script>
    // ================= THREE.JS SETUP =================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('earth3d').appendChild(renderer.domElement);

    // Camera controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 6;
    controls.maxDistance = 20;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    // Earth
    const earthGeometry = new THREE.SphereGeometry(5, 64, 64);
    let earthTexture;
    try {
      earthTexture = new THREE.TextureLoader().load(
        'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg',
        () => log("Earth texture loaded successfully"),
        undefined,
        (err) => {
          log("ERROR: Failed to load Earth texture");
          console.error("Texture load error:", err);
        }
      );
    } catch (e) {
      log("ERROR: Texture loader initialization failed");
      console.error("Texture loader error:", e);
    }
    const earthMaterial = new THREE.MeshPhongMaterial({ 
      map: earthTexture || new THREE.Texture(), // Fallback to blank texture
      specular: new THREE.Color(0x333333),
      shininess: 5
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    // Missile trail particles
    const missileTrails = [];
    const particleGeometry = new THREE.BufferGeometry();
    const particleMaterial = new THREE.PointsMaterial({
      color: 0xff4500,
      size: 0.1,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    // Nuclear explosion particles
    const explosionParticles = new THREE.Group();
    scene.add(explosionParticles);

    // Explosion lights group
    const explosionLights = new THREE.Group();
    scene.add(explosionLights);

    // Camera position
    camera.position.z = 15;

    // ================= MISSILE CONTROL SYSTEM =================
    const bootLines = [
      "[OK] INITIALIZING SECURE BOOT...",
      "[OK] VERIFYING BIOS INTEGRITY...",
      "[OK] LOADING NUCLEAR CONTROL MODULES...",
      "[OK] SATELLITE UPLINK ESTABLISHED...",
      "[OK] DECRYPTING COMMAND PROTOCOLS...",
      "[OK] ENEMY INTERCEPT: MOVEMENT DETECTED.",
      "[OK] ENEMY LOG: BORDER BREACH ATTEMPT.",
      "[OK] INTERFACE SECURE. READY."
    ];

    // DOM elements
    const bootDiv = document.getElementById("terminalBoot");
    const consoleDiv = document.getElementById("console");
    const phase1 = document.getElementById("phase1");
    const phase2 = document.getElementById("phase2");
    const phase3 = document.getElementById("phase3");
    const phase4 = document.getElementById("phase4");
    const radarContainer = document.getElementById("radarContainer");
    const radarCanvas = document.getElementById("radarCanvas");
    const radarCtx = radarCanvas.getContext('2d');
    const explosionEffect = document.getElementById("explosionEffect");
    const siren = document.getElementById("sirenAudio");
    const launchSound = document.getElementById("launchAudio");
    const explosionSound = document.getElementById("explosionAudio");

    // System state
    let targets = [];
    let activeMissiles = [];
    let sweepAngle = 0;
    let missileCountdown = null;
    let isSirenPlaying = false;
    let allTargetsHit = false;

    // Initialize radar canvas
    radarCanvas.width = 300;
    radarCanvas.height = 300;

    // ================= FUNCTIONS =================
    function log(message) {
      consoleDiv.innerHTML += `> ${message}<br>`;
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function checkAllTargetsHit() {
      allTargetsHit = targets.every(target => target.hit);
      if (allTargetsHit && isSirenPlaying) {
        siren.pause();
        siren.currentTime = 0;
        isSirenPlaying = false;
        log("ALL TARGETS DESTROYED. ALARM DEACTIVATED.");
      }
      return allTargetsHit;
    }

    function startSiren() {
      if (!isSirenPlaying) {
        try {
          siren.loop = true;
          siren.play().then(() => {
            isSirenPlaying = true;
          }).catch(e => {
            log("WARNING: ALARM SIREN UNAVAILABLE");
            console.error("Siren error:", e);
          });
        } catch (e) {
          log("ERROR: Siren playback initialization failed");
          console.error("Siren init error:", e);
        }
      }
    }

    function bootSequence() {
      let i = 0;
      const bootInterval = setInterval(() => {
        if (i < bootLines.length) {
          bootDiv.innerHTML += `${bootLines[i]}<br>`;
          bootDiv.scrollTop = bootDiv.scrollHeight;
          i++;
        } else {
          clearInterval(bootInterval);
          phase1.classList.add("active");
        }
      }, 800);
    }

    function unlockSystem() {
      log("FACE SCAN COMPLETE. BIOMETRICS VERIFIED.");
      phase1.classList.remove("active");
      phase2.classList.add("active");
    }

    function authenticate() {
      const code = document.getElementById("code").value;
      const bio = document.getElementById("biometric").value;
      
      if (code === "RJO" && bio === "JAPAN") {
        log("AUTHENTICATION SUCCESSFUL. ACCESS GRANTED.");
        phase2.classList.remove("active");
        phase3.classList.add("active");
      } else {
        log("AUTHENTICATION FAILED. UNAUTHORIZED ACCESS ATTEMPT LOGGED.");
      }
    }

    function fixTarget() {
      const lat = document.getElementById("lat").value;
      const lon = document.getElementById("lon").value;
      
      if (!lat || !lon) {
        log("ERROR: TARGET COORDINATES REQUIRED.");
        return;
      }

      log(`ACQUIRING TARGET AT ${lat}°N ${lon}°E...`);
      setTimeout(() => {
        log("TARGET LOCKED. WEAPONS SYSTEMS ARMED.");
        phase3.classList.remove("active");
        phase4.classList.add("active");
        radarContainer.style.display = "block";
        initTargets();
        drawRadar();
      }, 2000);
    }

    function createMissileTrail(missile) {
      try {
        const particles = new THREE.BufferGeometry();
        const particleCount = 100;
        const positions = new Float32Array(particleCount * 3);
        
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const trail = new THREE.Points(
          particles,
          new THREE.PointsMaterial({
            color: 0xff4500,
            size: 0.1,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
          })
        );
        
        missile.trail = trail;
        scene.add(trail);
        return trail;
      } catch (e) {
        log("ERROR: Failed to create missile trail");
        console.error("Missile trail error:", e);
        return null;
      }
    }

    function updateMissileTrail(missile) {
      if (!missile.trail) return;
      
      try {
        const positions = missile.trail.geometry.attributes.position.array;
        
        // Shift all particles back
        for (let i = positions.length - 1; i >= 3; i--) {
          positions[i] = positions[i - 3];
        }
        
        // Add new position at head
        positions[0] = missile.position.x;
        positions[1] = missile.position.y;
        positions[2] = missile.position.z;
        
        missile.trail.geometry.attributes.position.needsUpdate = true;
      } catch (e) {
        log("ERROR: Failed to update missile trail");
        console.error("Update trail error:", e);
      }
    }

    function createExplosion(position, yieldMT) {
      try {
        // Flash effect
        explosionEffect.style.opacity = 1;
        setTimeout(() => {
          explosionEffect.style.opacity = 0;
        }, 500);
        
        // Play explosion sound
        explosionSound.currentTime = 0;
        explosionSound.play().catch(e => {
          log("WARNING: Explosion sound unavailable");
          console.error("Audio error:", e);
        });
        
        // 3D explosion particles
        const particleCount = 500;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        
        const radius = yieldMT * 0.1;
        
        for (let i = 0; i < particleCount; i++) {
          // Random spherical distribution
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const r = radius * Math.random();
          
          positions[i * 3] = position.x + r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = position.y + r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = position.z + r * Math.cos(phi);
          
          // Color gradient from yellow to red
          const colorIntensity = Math.random();
          colors[i * 3] = 1; // R
          colors[i * 3 + 1] = colorIntensity; // G
          colors[i * 3 + 2] = 0; // B
          
          sizes[i] = Math.random() * 0.5;
        }
        
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particles.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        
        const particleMaterial = new THREE.PointsMaterial({
          size: 0.2,
          vertexColors: true,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true
        });
        
        const explosion = new THREE.Points(particles, particleMaterial);
        explosion.userData.lifetime = 0;
        explosion.userData.maxLifetime = 2;
        explosionParticles.add(explosion);

        // Add explosion light
        const explosionLight = new THREE.PointLight(0xff4500, 2, 15, 2); // Increased intensity and distance
        explosionLight.position.copy(position);
        explosionLight.position.z += 0.5; // Slightly above surface
        explosionLight.userData.lifetime = 0;
        explosionLight.userData.maxLifetime = 1.5;
        explosionLights.add(explosionLight);
        
        return explosion;
      } catch (e) {
        log("ERROR: Failed to create explosion");
        console.error("Explosion error:", e);
        return null;
      }
    }

    function updateExplosions(deltaTime) {
      try {
        for (let i = explosionParticles.children.length - 1; i >= 0; i--) {
          const explosion = explosionParticles.children[i];
          explosion.userData.lifetime += deltaTime;
          
          if (explosion.userData.lifetime >= explosion.userData.maxLifetime) {
            explosionParticles.remove(explosion);
          } else {
            // Make explosion expand and fade
            const progress = explosion.userData.lifetime / explosion.userData.maxLifetime;
            const scale = 1 + progress * 3;
            explosion.scale.set(scale, scale, scale);
            
            // Update particle opacity
            const material = explosion.material;
            material.opacity = 1 - progress;
            material.size = 0.2 * (1 + progress * 2);
          }
        }

        // Update explosion lights
        for (let i = explosionLights.children.length - 1; i >= 0; i--) {
          const light = explosionLights.children[i];
          light.userData.lifetime += deltaTime;
          
          if (light.userData.lifetime >= light.userData.maxLifetime) {
            explosionLights.remove(light);
          } else {
            // Fade light intensity
            const progress = light.userData.lifetime / light.userData.maxLifetime;
            light.intensity = 2 * (1 - progress); // Adjusted for initial intensity
          }
        }
      } catch (e) {
        log("ERROR: Failed to update explosions");
        console.error("Update explosions error:", e);
      }
    }

    function launchMissile(targetIndex) {
      const silo = document.getElementById("siloSelect").value;
      const missileType = document.getElementById("missileSelect").value;
      const warhead = document.getElementById("warheadSelect").value;
      
      if (!silo || !missileType || !warhead) {
        log("ERROR: MISSILE PARAMETERS NOT SPECIFIED");
        return;
      }
      
      try {
        // Play launch sound
        launchSound.currentTime = 0;
        launchSound.play().catch(e => {
          log("WARNING: Launch sound unavailable");
          console.error("Audio error:", e);
        });
        
        log(`LAUNCHING ${missileType} WITH ${warhead} FROM ${silo}...`);
        
        // Create missile object
        const missile = {
          position: new THREE.Vector3(
            (Math.random() - 0.5) * 2,
            -5,
            (Math.random() - 0.5) * 2
          ),
          target: targets[targetIndex % targets.length],
          speed: 0.02,
          progress: 0,
          trail: null,
          warhead: warhead,
          radarPosition: { 
            x: 20 + Math.random() * 260, 
            y: 20 + Math.random() * 260 
          },
          radarProgress: 0,
          visible: true,
          targetHit: false,
          exploded: false
        };
        
        // Set missile's radar starting position based on silo
        switch(silo) {
          case "SILO ALPHA - ALASKA":
            missile.radarPosition = { x: 50, y: 50 };
            break;
          case "SILO BRAVO - NEVADA":
            missile.radarPosition = { x: 100, y: 150 };
            break;
          case "SILO CHARLIE - INDIA":
            missile.radarPosition = { x: 200, y: 200 };
            break;
          case "SILO DELTA - RUSSIA":
            missile.radarPosition = { x: 250, y: 100 };
            break;
          case "SILO ECHO - CHINA":
            missile.radarPosition = { x: 150, y: 50 };
            break;
        }
        
        // Create trail
        createMissileTrail(missile);
        activeMissiles.push(missile);
      } catch (e) {
        log("ERROR: Failed to launch missile");
        console.error("Launch missile error:", e);
      }
    }

    function updateMissiles(deltaTime) {
      try {
        for (let i = activeMissiles.length - 1; i >= 0; i--) {
          const missile = activeMissiles[i];
          
          if (missile.exploded) {
            // Remove missile after explosion
            if (missile.trail) {
              scene.remove(missile.trail);
            }
            activeMissiles.splice(i, 1);
            continue;
          }
          
          if (missile.progress >= 1 && !missile.exploded) {
            // Missile reached target - create explosion
            const yieldMT = parseFloat(missile.warhead.match(/\((\d+\.?\d*)MT\)/)?.[1] || 1);
            const explosionPos = new THREE.Vector3(
              missile.target.x * 0.1,
              missile.target.y * 0.1,
              5.1 // Slightly above surface for visibility
            );
            
            createExplosion(explosionPos, yieldMT);
            
            // Mark target as hit and missile as exploded
            missile.target.hit = true;
            missile.exploded = true;
            
            // Remove trail
            if (missile.trail) {
              scene.remove(missile.trail);
            }
            
            // Remove missile from active list immediately
            activeMissiles.splice(i, 1);
            
            log(`TARGET HIT BY ${missile.warhead}. YIELD: ${yieldMT} MEGATONS.`);
            
            // Force radar redraw
            drawRadar();
            
            // Check if all targets are hit
            checkAllTargetsHit();
          } else {
            // Update missile position
            missile.progress += missile.speed * deltaTime;
            
            // Make missile disappear after leaving Earth's view
            if (missile.progress > 0.3 && missile.visible) {
              missile.visible = false;
              if (missile.trail) {
                scene.remove(missile.trail);
              }
            }
            
            // Update radar position when missile is "in space"
            if (!missile.visible && !missile.exploded) {
              missile.radarProgress += 0.015;
              const progress = Math.min(missile.radarProgress, 1);
              missile.radarPosition.x = missile.radarPosition.x + (missile.target.x - missile.radarPosition.x) * progress;
              missile.radarPosition.y = missile.radarPosition.y + (missile.target.y - missile.radarPosition.y) * progress;
              
              // Check if missile reached target on radar
              const distanceToTarget = Math.sqrt(
                Math.pow(missile.radarPosition.x - missile.target.x, 2) +
                Math.pow(missile.radarPosition.y - missile.target.y, 2)
              );
              
              if (distanceToTarget < 10 && !missile.target.hit) {
                missile.progress = 1; // Trigger hit
              }
            }
            
            // Update 3D position
            missile.position.lerp(
              new THREE.Vector3(
                missile.target.x * 0.1,
                missile.target.y * 0.1,
                5
              ),
              missile.progress
            );
            
            // Update trail if visible
            if (missile.visible && missile.trail) {
              updateMissileTrail(missile);
            }
          }
        }
      } catch (e) {
        log("ERROR: Failed to update missiles");
        console.error("Update missiles error:", e);
      }
    }

    function startLaunch() {
      try {
        const count = parseInt(document.getElementById("missileCount").value);
        
        if (isNaN(count) || count < 1 || count > 5) {
          log("ERROR: INVALID MISSILE COUNT (1-5 ONLY)");
          return;
        }
        
        // Clear any existing countdown
        if (missileCountdown) {
          clearInterval(missileCountdown);
        }
        
        // Start siren (will continue until all targets are hit)
        startSiren();
        
        log(`INITIATING LAUNCH SEQUENCE FOR ${count} MISSILE(S)...`);
        
        // Start countdown
        let remaining = 5;
        missileCountdown = setInterval(() => {
          log(`T-MINUS ${remaining}...`);
          remaining--;
          
          if (remaining < 0) {
            clearInterval(missileCountdown);
            missileCountdown = null;
            
            // Launch missiles (up to 5)
            for (let i = 0; i < Math.min(count, 5); i++) {
              setTimeout(() => launchMissile(i), i * 1000);
            }
          }
        }, 1000);
      } catch (e) {
        log("ERROR: Failed to start launch");
        console.error("Start launch error:", e);
      }
    }

    function initTargets() {
      try {
        targets = [
          { x: 100, y: 100, hit: false },
          { x: 200, y: 150, hit: false },
          { x: 150, y: 200, hit: false },
          { x: 50, y: 250, hit: false },
          { x: 250, y: 50, hit: false }
        ];
        allTargetsHit = false;
      } catch (e) {
        log("ERROR: Failed to initialize targets");
        console.error("Init targets error:", e);
      }
    }

    function drawRadar() {
      try {
        radarCtx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
        
        // Draw radar circles
        radarCtx.strokeStyle = "rgba(0, 255, 0, 0.3)";
        radarCtx.lineWidth = 1;
        for (let r = 50; r <= 150; r += 50) {
          radarCtx.beginPath();
          radarCtx.arc(150, 150, r, 0, Math.PI * 2);
          radarCtx.stroke();
        }
        
        // Draw radar sweep
        radarCtx.strokeStyle = "rgba(0, 255, 0, 0.8)";
        radarCtx.lineWidth = 2;
        radarCtx.beginPath();
        radarCtx.moveTo(150, 150);
        radarCtx.lineTo(
          150 + Math.cos(sweepAngle) * 150,
          150 + Math.sin(sweepAngle) * 150
        );
        radarCtx.stroke();
        
        sweepAngle += 0.05;
        if (sweepAngle > Math.PI * 2) sweepAngle = 0;
        
        // Draw targets (only if not hit)
        targets.forEach(target => {
          if (!target.hit) {
            const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
            radarCtx.fillStyle = `rgba(255, 0, 0, ${pulse})`;
            radarCtx.beginPath();
            radarCtx.arc(target.x, target.y, 8, 0, Math.PI * 2);
            radarCtx.fill();
          }
        });
        
        // Draw missiles on radar (when they're in space and not exploded)
        activeMissiles.forEach(missile => {
          if (!missile.visible && !missile.exploded) {
            radarCtx.fillStyle = "yellow";
            radarCtx.beginPath();
            radarCtx.arc(
              missile.radarPosition.x,
              missile.radarPosition.y,
              4, 0, Math.PI * 2
            );
            radarCtx.fill();
          }
        });
        
        requestAnimationFrame(drawRadar);
      } catch (e) {
        log("ERROR: Failed to draw radar");
        console.error("Draw radar error:", e);
      }
    }

    function resetAll() {
      try {
        location.reload();
      } catch (e) {
        log("ERROR: Failed to reset system");
        console.error("Reset error:", e);
      }
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      try {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      } catch (e) {
        log("ERROR: Failed to handle window resize");
        console.error("Resize error:", e);
      }
    });

    // Animation loop
    let lastTime = 0;
    function animate(currentTime) {
      try {
        const deltaTime = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        
        requestAnimationFrame(animate);
        
        // Update Earth rotation
        earth.rotation.y += 0.001;
        
        // Update controls
        controls.update();
        
        // Update missiles
        updateMissiles(deltaTime);
        
        // Update explosions
        updateExplosions(deltaTime);
        
        renderer.render(scene, camera);
      } catch (e) {
        log("ERROR: Animation loop failed");
        console.error("Animation error:", e);
      }
    }

    // Initialize
    try {
      bootSequence();
      animate(0);
    } catch (e) {
      log("ERROR: System initialization failed");
      console.error("Init error:", e);
    }
  </script>
</body>
